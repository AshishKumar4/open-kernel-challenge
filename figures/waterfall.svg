<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="One divergent phi, a waterfall loop, and 1 to 3 microseconds">
<title>One divergent phi, a waterfall loop, and 1 to 3 microseconds</title>
<defs>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6FDE"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#D1495B"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2A9D6F"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#E0A030"/></marker>
<marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7C5CC4"/></marker>
<marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1F9AA8"/></marker>
<marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1B2430"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5B6573"/></marker>
<filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1B2430" flood-opacity="0.12"/></filter>
</defs>
<rect width="1240" height="680" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#1B2430" font-weight="700" text-anchor="start" opacity="1">One divergent phi, a waterfall loop, and 1 to 3 µs</text>
<text x="30" y="62" font-size="13" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">How a never-taken trap in the MoE&#x27;s tiny builds was worth about 0.3% of the score.</text>
<rect x="30" y="84" width="276" height="86" rx="8" fill="#E7EFFC" stroke="#2F6FDE" stroke-width="1.3" filter="url(#lift)" opacity="1"/>
<rect x="30" y="84" width="5" height="86" rx="2.5" fill="#2F6FDE"/>
<text x="170.0" y="114.0" font-size="15" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">CUDA source</text>
<text x="170.0" y="133.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">if (nF &gt; 0) __trap();</text>
<text x="170.0" y="150.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">or __builtin_assume(nF &lt;= 0)</text>
<rect x="328" y="84" width="276" height="86" rx="8" fill="#EFEAF9" stroke="#7C5CC4" stroke-width="1.3" filter="url(#lift)" opacity="1"/>
<rect x="328" y="84" width="5" height="86" rx="2.5" fill="#7C5CC4"/>
<text x="468.0" y="114.0" font-size="15" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">NVVM (LLVM)</text>
<text x="468.0" y="133.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" opacity="1">assume lets LLVM merge gridDim.x</text>
<text x="468.0" y="150.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" opacity="1">into a phi at a tid-dependent join</text>
<path d="M308,127 L326,127" fill="none" stroke="#1B2430" stroke-width="1.6" marker-end="url(#arr-ink)" stroke-linejoin="round"/>
<rect x="626" y="84" width="276" height="86" rx="8" fill="#FCF3E1" stroke="#E0A030" stroke-width="1.3" filter="url(#lift)" opacity="1"/>
<rect x="626" y="84" width="5" height="86" rx="2.5" fill="#E0A030"/>
<text x="766.0" y="114.0" font-size="15" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">ptxas divergence</text>
<text x="766.0" y="133.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" opacity="1">a phi at a divergent join is divergent,</text>
<text x="766.0" y="150.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" opacity="1">even if both inputs are equal</text>
<path d="M606,127 L624,127" fill="none" stroke="#1B2430" stroke-width="1.6" marker-end="url(#arr-ink)" stroke-linejoin="round"/>
<rect x="924" y="84" width="276" height="86" rx="8" fill="#FBEAED" stroke="#D1495B" stroke-width="1.3" filter="url(#lift)" opacity="1"/>
<rect x="924" y="84" width="5" height="86" rx="2.5" fill="#D1495B"/>
<text x="1064.0" y="114.0" font-size="15" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">SASS</text>
<text x="1064.0" y="133.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" opacity="1">each ring refill becomes a waterfall:</text>
<text x="1064.0" y="150.0" font-size="12" fill="#5B6573" font-weight="400" text-anchor="middle" opacity="1">ELECT, 4x R2UR, BRA.U.ANY</text>
<path d="M904,127 L922,127" fill="none" stroke="#1B2430" stroke-width="1.6" marker-end="url(#arr-ink)" stroke-linejoin="round"/>
<rect x="30" y="200" width="360" height="148" rx="8" fill="#0E1A2B" stroke="#2A9D6F" stroke-width="1.5" opacity="1"/>
<text x="44" y="222" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="start" opacity="1">converged warp: 5 instructions</text>
<text x="44" y="244" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">ELECT P0, URZ, PT</text>
<text x="44" y="263" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">UBLKCP [UR4], [UR6], UR8</text>
<text x="44" y="282" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">... (stage bookkeeping)</text>
<text x="44" y="301" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1"></text>
<text x="44" y="320" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1"></text>
<text x="44" y="339" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1"></text>
<rect x="410" y="200" width="360" height="167" rx="8" fill="#0E1A2B" stroke="#D1495B" stroke-width="1.5" opacity="1"/>
<text x="424" y="222" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="start" opacity="1">divergent operands: 9 instructions, loops per lane</text>
<text x="424" y="244" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">ELECT P0, URZ, PT</text>
<text x="424" y="263" font-size="12" fill="#FFB4BF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">R2UR UR4, R2</text>
<text x="424" y="282" font-size="12" fill="#FFB4BF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">R2UR UR5, R3</text>
<text x="424" y="301" font-size="12" fill="#FFB4BF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">R2UR UR6, R4</text>
<text x="424" y="320" font-size="12" fill="#FFB4BF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">R2UR UR7, R5</text>
<text x="424" y="339" font-size="12" fill="#CFE0FF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">UBLKCP [UR4], [UR6], UR8</text>
<text x="424" y="358" font-size="12" fill="#FFB4BF" font-weight="500" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" opacity="1">BRA.U.ANY  back to ELECT</text>
<text x="30" y="380" font-size="11.5" fill="#5B6573" font-weight="400" text-anchor="start" font-style="italic" opacity="1">Schematic. The real listings come from harness/ptxas/elect.py over each build&#x27;s cuobjdump output.</text>
<rect x="800" y="200" width="410" height="168" rx="10" fill="#E4F4EE" stroke="#2A9D6F" stroke-width="1.2" opacity="1"/>
<text x="818" y="226" font-size="14" fill="#1B2430" font-weight="650" text-anchor="start" opacity="1">What keeps the operands uniform</text>
<text x="818" y="254" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• warp index via __shfl_sync(~0u, tid &gt;&gt; 5, 0)</text>
<text x="818" y="276" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• spin loops written inside the asm block</text>
<text x="818" y="298" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• issue under elect.sync from a converged warp</text>
<text x="818" y="320" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• an opaque nctaid read (asm volatile mov)</text>
<text x="818" y="342" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• and the accident that started it: asm trap; blocks the merge</text>
<text x="30" y="420" font-size="13" fill="#1B2430" font-weight="650" text-anchor="start" opacity="1">Layer time per case, µs above the control&#x27;s (200-rep screens, all checks pass; two identical controls differ by 0.7 to 1.4 µs)</text>
