<rect width="1240" height="560" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#1B2430" font-weight="700" text-anchor="start" opacity="1">The Lean model: what it covers, and how far to trust each part</text>
<text x="30" y="62" font-size="13" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">Green: kernel-checked proofs. Amber: calibrated against measurements. Red: known gaps.</text>
