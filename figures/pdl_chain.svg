<rect width="1240" height="550" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#1B2430" font-weight="700" text-anchor="start" opacity="1">Decode 1, sliding layer: one layer in 55 µs</text>
<text x="30" y="62" font-size="13" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">nsys of one graph replay. Each kernel starts 1 to 5 µs before its predecessor ends (PDL). Bars: kernel start to end.</text>
