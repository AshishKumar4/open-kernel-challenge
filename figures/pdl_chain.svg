<text x="238" y="390" font-size="12.5" fill="#1B2430" font-weight="600" text-anchor="end" opacity="1">finish</text>
<rect x="1100.2857142857142" y="376" width="64.76785714285734" height="22" rx="4" fill="#FCF3E1" stroke="#E0A030" stroke-width="1.2" opacity="1"/>
<rect x="1100.2857142857142" y="376" width="34.875" height="22" rx="4" fill="#E0A030" stroke="none" stroke-width="1.2" opacity="0.25"/>
<line x1="758.2" y1="90" x2="758.2" y2="414" stroke="#1F9AA8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="764.1785714285714" y="430" font-size="12" fill="#1F9AA8" font-weight="650" text-anchor="start" opacity="1">30.6 µs: all 134.7 MB of the layer&#x27;s bytes at 4.4 TB/s</text>
<text x="30" y="458" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">After the pooler ends, the route, experts, unpooler and finish take 21.2 µs for 34.6 MB that stream in 7.9 µs. The rest is ramps, hand-offs and tails.</text>
<text x="30" y="480" font-size="12" fill="#5B6573" font-weight="400" text-anchor="start" font-style="italic" opacity="1">Shaded: the part of a kernel&#x27;s lifetime that overlaps its predecessor (prologue and weight prefetch before griddepcontrol.wait).</text>
</svg>
