<text x="1080.357142857143" y="80" font-size="11" fill="#5B6573" font-weight="600" text-anchor="middle" opacity="1">50 µs</text>
<text x="238" y="110" font-size="12.5" fill="#1B2430" font-weight="600" text-anchor="end" opacity="1">qkv projection</text>
<rect x="250.0" y="96" width="146.14285714285717" height="22" rx="4" fill="#E7EFFC" stroke="#2F6FDE" stroke-width="1.2" opacity="1"/>
<text x="238" y="150" font-size="12.5" fill="#1B2430" font-weight="600" text-anchor="end" opacity="1">attention</text>
<rect x="366.25" y="136" width="117.91071428571428" height="22" rx="4" fill="#EFEAF9" stroke="#7C5CC4" stroke-width="1.2" opacity="1"/>
