<text x="238" y="190" font-size="12.5" fill="#1B2430" font-weight="600" text-anchor="end" opacity="1">o projection + boundary</text>
<rect x="404.44642857142856" y="176" width="142.82142857142856" height="22" rx="4" fill="#E7EFFC" stroke="#2F6FDE" stroke-width="1.2" opacity="1"/>
<rect x="404.44642857142856" y="176" width="79.71428571428572" height="22" rx="4" fill="#2F6FDE" stroke="none" stroke-width="1.2" opacity="0.25"/>
<text x="238" y="230" font-size="12.5" fill="#1B2430" font-weight="600" text-anchor="end" opacity="1">pooler + router</text>
<rect x="533.9821428571429" y="216" width="279.0" height="22" rx="4" fill="#E7EFFC" stroke="#2F6FDE" stroke-width="1.2" opacity="1"/>
<rect x="533.9821428571429" y="216" width="13.28571428571422" height="22" rx="4" fill="#2F6FDE" stroke="none" stroke-width="1.2" opacity="0.25"/>
<text x="238" y="270" font-size="12.5" fill="#1B2430" font-weight="600" text-anchor="end" opacity="1">route</text>
<rect x="751.5357142857142" y="256" width="86.35714285714289" height="22" rx="4" fill="#FCF3E1" stroke="#E0A030" stroke-width="1.2" opacity="1"/>
<rect x="751.5357142857142" y="256" width="61.44642857142867" height="22" rx="4" fill="#E0A030" stroke="none" stroke-width="1.2" opacity="0.25"/>
<text x="238" y="310" font-size="12.5" fill="#1B2430" font-weight="600" text-anchor="end" opacity="1">experts (MoE)</text>
