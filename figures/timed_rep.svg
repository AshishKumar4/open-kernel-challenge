<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 330" width="1240" height="330" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="One timed repetition in the harness">
<title>One timed repetition in the harness</title>
<defs>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6FDE"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#D1495B"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2A9D6F"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#E0A030"/></marker>
<marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7C5CC4"/></marker>
<marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1F9AA8"/></marker>
<marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1B2430"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5B6573"/></marker>
<filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1B2430" flood-opacity="0.12"/></filter>
</defs>
<rect width="1240" height="330" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#1B2430" font-weight="700" text-anchor="start" opacity="1">What &#x27;judge-style&#x27; timing means</text>
<text x="30" y="62" font-size="13" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">One pair of repetitions on the GPU stream, as okc_harness.py enqueues it. The next pair swaps the order.</text>
<rect x="30" y="96" width="66" height="44" rx="5" fill="#F4F6F9" stroke="#5B6573" stroke-width="1.2" opacity="1"/>
<text x="63.0" y="123" font-size="12.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">hold</text>
<rect x="100" y="96" width="116" height="44" rx="5" fill="#FCF3E1" stroke="#E0A030" stroke-width="1.2" opacity="1"/>
<text x="158.0" y="123" font-size="12.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">flush L2</text>
<rect x="220" y="96" width="26" height="44" rx="5" fill="#F4F6F9" stroke="#1B2430" stroke-width="1.2" opacity="1"/>
<text x="233.0" y="123" font-size="10.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">ev</text>
<rect x="250" y="96" width="256" height="44" rx="5" fill="#E7EFFC" stroke="#2F6FDE" stroke-width="1.2" opacity="1"/>
<text x="378.0" y="123" font-size="12.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">graph replay: candidate</text>
<rect x="510" y="96" width="26" height="44" rx="5" fill="#F4F6F9" stroke="#1B2430" stroke-width="1.2" opacity="1"/>
<text x="523.0" y="123" font-size="10.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">ev</text>
<rect x="540" y="96" width="116" height="44" rx="5" fill="#FCF3E1" stroke="#E0A030" stroke-width="1.2" opacity="1"/>
<text x="598.0" y="123" font-size="12.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">flush L2</text>
<rect x="660" y="96" width="26" height="44" rx="5" fill="#F4F6F9" stroke="#1B2430" stroke-width="1.2" opacity="1"/>
<text x="673.0" y="123" font-size="10.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">ev</text>
<rect x="690" y="96" width="256" height="44" rx="5" fill="#EFEAF9" stroke="#7C5CC4" stroke-width="1.2" opacity="1"/>
<text x="818.0" y="123" font-size="12.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">graph replay: reference</text>
<rect x="950" y="96" width="26" height="44" rx="5" fill="#F4F6F9" stroke="#1B2430" stroke-width="1.2" opacity="1"/>
<text x="963.0" y="123" font-size="10.5" fill="#1B2430" font-weight="650" text-anchor="middle" opacity="1">ev</text>
<text x="30" y="86" font-size="11.5" fill="#5B6573" font-weight="500" text-anchor="start" opacity="1">hold = cuStreamWaitValue32 on a pinned host word, released only after the whole pair is queued, so a descheduled launcher cannot land inside a timed interval; flush = a read of twice the L2; ev = CUDA event</text>
<text x="30" y="210" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• 20 fresh inputs per shape, copied into both sides&#x27; captured buffers; every replay starts with a cold L2</text>
<text x="30" y="232" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• fixed replay cost (2 x one-node graph minus a two-node graph, about 4.35 µs) subtracted from both sides</text>
<text x="30" y="254" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• pair ratio = geometric mean of the two orders; a shape&#x27;s speedup = median over the pairs</text>
<text x="30" y="276" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• a load&#x27;s time = 46 sliding + 16 full layers; the score = geometric mean of the six loads</text>
<text x="30" y="298" font-size="12.5" fill="#1B2430" font-weight="400" text-anchor="start" opacity="1">• with two runners on a GPU, a bench holds the GPU lock shared and takes it exclusive only while it times</text>
</svg>
