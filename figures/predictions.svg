<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 524" width="1240" height="524" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Model predictions against measurements">
<title>Model predictions against measurements</title>
<defs>
<marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2F6FDE"/></marker>
<marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#D1495B"/></marker>
<marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2A9D6F"/></marker>
<marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#E0A030"/></marker>
<marker id="arr-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7C5CC4"/></marker>
<marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1F9AA8"/></marker>
<marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1B2430"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5B6573"/></marker>
<filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1B2430" flood-opacity="0.12"/></filter>
</defs>
<rect width="1240" height="524" fill="#FFFFFF"/>
<text x="30" y="40" font-size="20" fill="#1B2430" font-weight="700" text-anchor="start" opacity="1">What the timing model predicted, and what the GPU said</text>
<text x="30" y="62" font-size="13" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">Accurate where it models streaming; optimistic wherever synchronization under load decides.</text>
<rect x="20" y="84" width="1200" height="38" rx="6" fill="#FAFBFC" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="108" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">small-MoE stream is memory-bound, instruction cuts can&#x27;t gain</text>
<rect x="640" y="93.5" width="49.349999999999994" height="20.5" rx="10.25" fill="#E4F4EE" stroke="#2A9D6F" stroke-width="1" opacity="1"/>
<text x="664.675" y="109" font-size="11.5" fill="#2A9D6F" font-weight="600" text-anchor="middle" opacity="1">right</text>
<text x="820" y="108" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">consistent with 12+ cut-with-no-gain results</text>
<rect x="20" y="130" width="1200" height="38" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="154" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">big MoE (32+ tokens): more bytes in flight can&#x27;t help (48 KB/SM plateau)</text>
<rect x="640" y="139.5" width="49.349999999999994" height="20.5" rx="10.25" fill="#E4F4EE" stroke="#2A9D6F" stroke-width="1" opacity="1"/>
<text x="664.675" y="155" font-size="11.5" fill="#2A9D6F" font-weight="600" text-anchor="middle" opacity="1">right</text>
<text x="820" y="154" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">its 4th weight slot bought nothing</text>
<rect x="20" y="176" width="1200" height="38" rx="6" fill="#FAFBFC" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="200" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">cold instruction fetch is not the d1/v1 mechanism</text>
<rect x="640" y="185.5" width="49.349999999999994" height="20.5" rx="10.25" fill="#E4F4EE" stroke="#2A9D6F" stroke-width="1" opacity="1"/>
<text x="664.675" y="201" font-size="11.5" fill="#2A9D6F" font-weight="600" text-anchor="middle" opacity="1">right</text>
<text x="820" y="200" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">flushed 21.57 vs warm 21.50 µs</text>
<rect x="20" y="222" width="1200" height="38" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="246" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">route() frequency-hint fix: +0.37% at d1s</text>
<rect x="640" y="231.5" width="136.06" height="20.5" rx="10.25" fill="#FCF3E1" stroke="#E0A030" stroke-width="1" opacity="1"/>
<text x="708.03" y="247" font-size="11.5" fill="#E0A030" font-weight="600" text-anchor="middle" opacity="1">right way, too big</text>
<text x="820" y="246" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">+0.17% on its cases; adopted</text>
<rect x="20" y="268" width="1200" height="38" rx="6" fill="#FAFBFC" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="292" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">WGS cost-width fix at d32s: 9 to 10 µs</text>
<rect x="640" y="277.5" width="136.06" height="20.5" rx="10.25" fill="#FCF3E1" stroke="#E0A030" stroke-width="1" opacity="1"/>
<text x="708.03" y="293" font-size="11.5" fill="#E0A030" font-weight="600" text-anchor="middle" opacity="1">right way, too big</text>
<text x="820" y="292" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">2.4 µs; the cause was right</text>
<rect x="20" y="314" width="1200" height="38" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="338" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">bulk-copy K/V ring for full attention: +0.6 to 1.4%</text>
<rect x="640" y="323.5" width="49.349999999999994" height="20.5" rx="10.25" fill="#FBEAED" stroke="#D1495B" stroke-width="1" opacity="1"/>
<text x="664.675" y="339" font-size="11.5" fill="#D1495B" font-weight="600" text-anchor="middle" opacity="1">wrong</text>
<text x="820" y="338" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">paged rows: 2.0 to 3.35 TB/s vs cp.async 3.80</text>
<rect x="20" y="360" width="1200" height="38" rx="6" fill="#FAFBFC" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="384" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">FP16 attention accumulation: +0.15 to 0.3%</text>
<rect x="640" y="369.5" width="49.349999999999994" height="20.5" rx="10.25" fill="#FBEAED" stroke="#D1495B" stroke-width="1" opacity="1"/>
<text x="664.675" y="385" font-size="11.5" fill="#D1495B" font-weight="600" text-anchor="middle" opacity="1">wrong</text>
<text x="820" y="384" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">64 of 68 conversions are K/V format; ~0</text>
<rect x="20" y="406" width="1200" height="38" rx="6" fill="#FFFFFF" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="430" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">cluster K-slice MoE: 43 to 47 µs at d32s</text>
<rect x="640" y="415.5" width="49.349999999999994" height="20.5" rx="10.25" fill="#FBEAED" stroke="#D1495B" stroke-width="1" opacity="1"/>
<text x="664.675" y="431" font-size="11.5" fill="#D1495B" font-weight="600" text-anchor="middle" opacity="1">wrong</text>
<text x="820" y="430" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">78 to 83 µs even with no exchange; no-go</text>
<rect x="20" y="452" width="1200" height="38" rx="6" fill="#FAFBFC" stroke="none" stroke-width="1.2" opacity="1"/>
<text x="36" y="476" font-size="13" fill="#1B2430" font-weight="600" text-anchor="start" opacity="1">WIDE 96-token jobs: +0.55%</text>
<rect x="640" y="461.5" width="49.349999999999994" height="20.5" rx="10.25" fill="#FBEAED" stroke="#D1495B" stroke-width="1" opacity="1"/>
<text x="664.675" y="477" font-size="11.5" fill="#D1495B" font-weight="600" text-anchor="middle" opacity="1">wrong</text>
<text x="820" y="476" font-size="12.5" fill="#5B6573" font-weight="400" text-anchor="start" opacity="1">about -1% at verify 32 sliding</text>
</svg>
