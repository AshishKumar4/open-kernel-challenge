<text x="980" y="391" font-size="12" fill="#1B2430" font-weight="650" text-anchor="start" opacity="1">up to $3.00: 82%</text>
<text x="30" y="426" font-size="11.5" fill="#5B6573" font-weight="400" text-anchor="start" font-style="italic" opacity="1">Sub-$1 slots clustered at 00:00 to 07:00 UTC. We ran under a $2.50 cap; the spot price at the switch was $1.60 in eu-north1.</text>
